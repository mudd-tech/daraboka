<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0907">

    <meta name="description"
          content="منيو درابوكا الإلكتروني - مدعوم من Tapio">

    <title>DRABOKA | TAPIO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #0b0907;
            --gold: #d9b477;
            --light-gold: #f1d6a3;
            --panel: #17110c;
            --text: #ffffff;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 14px 30px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        /* الشعار */

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .logo {
            width: 85px;
            height: 85px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            color: var(--light-gold);
            font-size: 36px;
        }

        .brand-name {
            font-size: 30px;
            letter-spacing: 4px;
            color: var(--light-gold);
        }

        .subtitle {
            color: #c7b9a4;
            margin-top: 10px;
            font-size: 12px;
            letter-spacing: 1px;
            direction: ltr;
        }

        /* صورة المنيو */

        .menu-card {
            width: 100%;
            border: 1px solid var(--gold);
            border-radius: 16px;
            overflow: hidden;
            background: var(--panel);
            margin-bottom: 24px;
        }

        .menu-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            background: var(--panel);
        }

        .menu-caption {
            padding: 16px 10px;
            text-align: center;
            color: var(--light-gold);
            border-top: 1px solid #59452c;
            font-size: 17px;
        }

        /* الأزرار */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            min-height: 58px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-radius: 13px;
            text-decoration: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid var(--gold);
            color: var(--light-gold);
            background: var(--panel);
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .google {
            background: linear-gradient(
                135deg,
                #f1d6a3,
                #c69a58
            );
            color: #211508;
            border: none;
        }

        .facebook {
            background: #17110c;
        }

        .whatsapp {
            background: #17110c;
        }

        .icon {
            font-size: 23px;
            flex-shrink: 0;
        }

        /* النص أسفل الأزرار */

        .note {
            text-align: center;
            margin-top: 22px;
            color: #c7b9a4;
            font-size: 13px;
            line-height: 1.9;
        }

        /* التذييل */

        footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #59452c;
            color: #c7b9a4;
            font-size: 13px;
        }

        .tapio {
            display: inline-block;
            margin-top: 10px;
            font-size: 21px;
            letter-spacing: 4px;
            color: var(--light-gold);
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- رأس الصفحة -->

        <header class="header">

            <div class="logo">T</div>

            <h1 class="brand-name">DRABOKA</h1>

            <p class="subtitle">
                COFFEE · DRINKS · DESSERTS · SHISHA
            </p>

        </header>

        <!-- صورة المنيو المرفوعة على GitHub -->

        <section class="menu-card">

            <img
                class="menu-image"
                src="./menu.PNG"
                alt="منيو درابوكا"
                loading="eager"
                onerror="this.onerror=null; this.src='./menu.png';"
            >

            <div class="menu-caption">
                ☕ منيو درابوكا
            </div>

        </section>

        <!-- الأزرار الرئيسية -->

        <nav class="buttons">

            <!-- تقييم جوجل -->

            <a
                class="btn google"
                href="https://maps.app.goo.gl/TSXeAYqSHPhptaj89?g_st=ic"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">⭐</span>
                <span>رأيك يهمنا ❤️</span>
            </a>

            <!-- صفحة فيسبوك -->

            <a
                class="btn facebook"
                href="https://www.facebook.com/share/1JXTHt2vqq/?mibextid=wwXIfr"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">📘</span>
                <span>تابعنا على فيسبوك</span>
            </a>

            <!-- طلب استانـد Tapio على واتساب -->

            <a
                class="btn whatsapp"
                href="https://wa.me/201284424161?text=%D8%A3%D9%87%D9%84%D8%A7%D9%8B%20Tapio%D8%8C%20%D8%B9%D8%A7%D9%88%D8%B2%20%D8%A3%D8%B7%D9%84%D8%A8%20%D8%A7%D8%B3%D8%AA%D8%A7%D9%86%D8%AF%20NFC%20%D9%84%D9%85%D8%B4%D8%B1%D9%88%D8%B9%D9%8A."
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">🚀</span>
                <span>عجبك الاستاند؟ اطلب واحد لمشروعك</span>
            </a>

        </nav>

        <p class="note">
            قرّب موبايلك من الاستاند واستمتع بتجربة أسرع وأسهل ✨
        </p>

        <!-- علامة Tapio -->

        <footer>
            مدعوم من
            <br>
            <strong class="tapio">TAPIO</strong>
        </footer>

    </main>

</body>

</html>
