<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Draboka | Tapio</title>

    <meta name="theme-color" content="#0b0907">
    <meta name="description" content="منيو درابوكا الإلكتروني - رأيك يهمنا مع Tapio">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #0b0907;
            color: #fff;
            padding: 20px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        /* الشعار */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 75px;
            height: 75px;
            border: 2px solid #d9b477;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 12px;
            font-size: 30px;
            color: #f1d6a3;
        }

        h1 {
            color: #f1d6a3;
            letter-spacing: 4px;
            font-size: 27px;
        }

        .subtitle {
            color: #c7b9a4;
            margin-top: 8px;
            font-size: 12px;
        }

        /* صورة المنيو */

        .menu {
            width: 100%;
            border: 1px solid #d9b477;
            border-radius: 12px;
            overflow: hidden;
            background: #17110c;
        }

        .menu img {
            display: block;
            width: 100%;
            height: auto;
        }

        .menu-title {
            padding: 15px;
            text-align: center;
            color: #f1d6a3;
        }

        /* الأزرار */

        .buttons {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 17px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #d9b477;
            background: #17110c;
            color: #f1d6a3;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .google {
            background: linear-gradient(135deg, #f1d6a3, #c69a58);
            color: #211508;
            border: none;
        }

        .facebook {
            background: #17110c;
        }

        .whatsapp {
            background: #17110c;
        }

        .icon {
            font-size: 22px;
        }

        /* التذييل */

        .note {
            text-align: center;
            color: #c7b9a4;
            font-size: 13px;
            margin-top: 22px;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #5b452a;
            color: #c7b9a4;
            font-size: 13px;
        }

        footer strong {
            color: #f1d6a3;
            letter-spacing: 3px;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- شعار Tapio -->

        <header class="header">
            <div class="logo">T</div>

            <h1>DRABOKA</h1>

            <p class="subtitle">
                COFFEE · DRINKS · DESSERTS · SHISHA
            </p>
        </header>

        <!-- صورة المنيو -->

        <section class="menu">

            <img
                src="assets/draboka-menu.jpeg"
                alt="منيو درابوكا"
            >

            <div class="menu-title">
                ☕ منيو درابوكا
            </div>

        </section>

        <!-- الأزرار -->

        <div class="buttons">

            <!-- تقييم جوجل -->

            <a
                class="btn google"
                href="https://maps.app.goo.gl/TSXeAYqSHPhptaj89?g_st=ic"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">⭐</span>
                رأيك يهمنا
            </a>

            <!-- صفحة فيسبوك -->

            <a
                class="btn facebook"
                href="https://www.facebook.com/share/1JXTHt2vqq/?mibextid=wwXIfr"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">📘</span>
                تابعنا على فيسبوك
            </a>

            <!-- طلب استانـد Tapio -->

            <a
                class="btn whatsapp"
                href="https://wa.me/201284424161?text=%D8%A3%D9%87%D9%84%D8%A7%D9%8B%20Tapio%D8%8C%20%D8%B9%D8%A7%D9%88%D8%B2%20%D8%A3%D8%B7%D9%84%D8%A8%20%D8%A7%D8%B3%D8%AA%D8%A7%D9%86%D8%AF%20NFC%20%D9%84%D9%85%D8%B4%D8%B1%D9%88%D8%B9%D9%8A."
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icon">🚀</span>
                عجبك الاستاند؟ اطلب واحد لمشروعك
            </a>

        </div>

        <p class="note">
            قرّب موبايلك من الاستاند واستمتع بتجربة أسرع وأسهل ✨
        </p>

        <footer>
            مدعوم من<br><br>
            <strong>TAPIO</strong>
        </footer>

    </div>

</body>
</html>
